<body>
<h1>RDC-Agent Browser QA</h1>
<p>Start the latest browser service with <code>pnpm run start:agent-browser</code>.</p>
<p>Copy the complete one-time <code>http://127.0.0.1:&lt;port&gt;/qa?qaBootstrap=...</code> URL from its log and open it in the in-app Browser. The bootstrap is single-use; a bare <code>/qa</code> URL intentionally returns 401.</p>
</body>
