storeDir: ~/.cache/rdc-agent/pnpm-store
preferOffline: true

# electron@42 install.js -> extract-zip -> yauzl@2 hangs on Node >=24.16; pin the upstream fix.
overrides:
  yauzl: 3.3.1

allowBuilds:
  '@swc/core': true
  electron-winstaller: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@3.0.150'
  - '@ai-sdk/provider-utils@4.0.39'
  - ai@6.0.226

patchedDependencies:
  # CodeMirror must use constructed sheets in Document under the desktop CSP.
  style-mod@4.1.3: patches/style-mod@4.1.3.patch
