storeDir: ~/.cache/rdc-agent/pnpm-store
preferOffline: true

# electron@42 install.js -> extract-zip -> yauzl@2 hangs on Node >=24.16; pin the upstream fix.
overrides:
  yauzl: 3.3.1
  # Held at the patched version below; a newer style-mod would silently drop the CSP patch.
  style-mod: 4.1.3
  # One zod and one KaTeX in the tree. gitlab-ai-provider only uses z.object/string/number/record, which zod 4 keeps;
  # its own zod 3 range carries the unpatched collection-validation memory exhaustion.
  gitlab-ai-provider>zod: ^4.6.7
  katex: ^0.19.1

allowBuilds:
  '@swc/core': true
  electron-winstaller: true
  esbuild: true

minimumReleaseAgeExclude:
  - '@ai-sdk/gateway@3.0.150'
  - '@ai-sdk/provider-utils@4.0.39'
  - ai@6.0.226

patchedDependencies:
  # CodeMirror must use constructed sheets in Document under the desktop CSP.
  style-mod@4.1.3: patches/style-mod@4.1.3.patch
