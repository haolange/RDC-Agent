name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:repository-hygiene
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      - run: pnpm run test:coverage
      - run: pnpm run check:coverage-ratchet
      - run: pnpm run check:architecture
      - run: pnpm run check:fidelity
      - run: pnpm run check:shared-exports
      - run: pnpm run check:work-process
      - run: pnpm run check:work-process-tool-coverage
      - run: pnpm run check:conversation-branch
      - run: pnpm run check:reasoning-delivery
      - run: pnpm run check:agent-runtime
      - run: pnpm run check:tool-system
      - run: pnpm run check:appearance
      - run: pnpm run check:session-projection
      - run: pnpm run check:right-rail
      - run: pnpm run check:settings-agents
      - run: pnpm run check:provider-system
      - run: pnpm run check:provider-catalog
      - run: pnpm run check:scoped-resources
      - run: pnpm run check:project-instructions
      - run: pnpm run check:prompt-plan-snapshot
      - run: pnpm run check:skills
      - run: pnpm run check:hooks
      - run: pnpm run check:memory-policy
      - run: pnpm run check:contracts
      - run: pnpm run build

  launcher-fresh-checkout:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Prepare through Windows wrapper
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\start-rdc-agent.cmd --prepare-only
      - name: Verify conditional Windows prepare
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = (& scripts\start-rdc-agent.cmd --prepare-only 2>&1) -join "`n"
          $output
          if ($output -notmatch 'Dependencies are current; skipping pnpm install') { throw 'Second prepare did not skip dependency install.' }
          if ($output -notmatch 'Build outputs are current; skipping build') { throw 'Second prepare did not skip build.' }
          $expected = [IO.Path]::GetFullPath((Join-Path $HOME '.cache\rdc-agent\pnpm-store'))
          $actual = [IO.Path]::GetFullPath((pnpm store path))
          if (-not $actual.StartsWith($expected, [StringComparison]::OrdinalIgnoreCase)) { throw "Unexpected pnpm store: $actual" }
      - name: Prepare through POSIX wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/start-rdc-agent.sh --prepare-only
      - name: Verify conditional POSIX prepare
        if: runner.os != 'Windows'
        shell: bash
        run: |
          output=$(sh scripts/start-rdc-agent.sh --prepare-only 2>&1)
          printf '%s\n' "$output"
          grep -F 'Dependencies are current; skipping pnpm install.' <<<"$output"
          grep -F 'Build outputs are current; skipping build.' <<<"$output"
          case "$(pnpm store path)" in
            "$HOME/.cache/rdc-agent/pnpm-store"/*) ;;
            *) echo "Unexpected pnpm store: $(pnpm store path)" >&2; exit 1 ;;
          esac
      - name: Build unpacked Windows release
        if: runner.os == 'Windows'
        run: pnpm run pack
      - name: Release config + SBOM/checksum helpers
        run: |
          pnpm run check:release-config
          pnpm run release:sbom
          pnpm run release:checksums

  browser-smoke:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        full_access: ['0', '1']
    env:
      RDC_AGENT_SMOKE_START: '1'
      RDC_AGENT_BROWSER_QA_FULL_ACCESS: ${{ matrix.full_access }}
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser QA smoke
        run: pnpm run smoke:agent-browser

  desktop-smoke:
    runs-on: windows-latest
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v4
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run pack
      - name: Desktop unpacked health smoke
        run: pnpm run smoke:desktop
      - name: Release config after pack
        run: |
          pnpm run check:release-config
          pnpm run release:sbom
          pnpm run release:checksums
