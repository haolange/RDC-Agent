name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      base:
        description: Commit to compare gates and rendering against (defaults to where the branch left the default branch)
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Superseded PR pushes are cancelled; every main and tag run completes.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
          fetch-depth: 0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Every dependency counts: renderer packages are bundled into the app even though they are devDependencies.
      - run: pnpm audit --audit-level=high
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm run test:coverage
      - run: pnpm run check:coverage-ratchet
      - run: pnpm run test:coverage:renderer
      - run: pnpm run check:coverage-ratchet coverage/renderer/coverage-summary.json scripts/fidelity/coverage-ratchet-renderer.json
      # Pull requests compare with their base and pushes with the previous head; a manual run uses its `base`
      # input or, without one, where the branch left the default branch.
      - name: Resolve the comparison base
        id: base
        shell: bash
        run: |
          base="${{ inputs.base || github.event.pull_request.base.sha || github.event.before }}"
          if [ -z "$base" ]; then base="$(git merge-base "origin/${{ github.event.repository.default_branch }}" HEAD)"; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
      - name: Check gates
        env:
          RDC_DIFF_BASE: ${{ steps.base.outputs.sha }}
        run: pnpm run check:gates
      # Informational: net growth of production, test and docs lines since the base, in the run summary.
      - name: Growth report
        env:
          RDC_DIFF_BASE: ${{ steps.base.outputs.sha }}
        run: node scripts/growth-report.mjs
      # The focused check:* vitest scripts (scoped resources, project instructions, prompt plan
      # snapshot, skills, hooks, memory policy, contracts, catalog compiler) run inside
      # test:coverage above; only their non-vitest halves run here.
      - run: node scripts/check-agent-tool-capability.mjs
      - run: pnpm run check:request-cache-profile
      - name: Check git diff whitespace
        env:
          RDC_DIFF_BASE: ${{ steps.base.outputs.sha }}
        run: pnpm run check:git-diff
      - run: pnpm run build
      - name: Renderer entry chunk budget
        run: node scripts/check-bundle-deps.mjs --entry-chunk

  macos-shell:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # Several runtime suites may lazily initialize Electron on a clean
      # runner. Keep this OS-bound surface single-file to avoid concurrent
      # Electron framework extraction into the same node_modules tree.
      - run: pnpm exec vitest run --no-file-parallelism src/main/runtime src/main/agent-runtime/tools/primitives

  windows-unit:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: pnpm
      # pnpm does not run Electron's install script; the launcher's prepare restores the
      # Electron runtime that main-process modules load, as in the other Windows jobs.
      - name: Prepare through Windows wrapper
        shell: cmd
        run: scripts\start-rdc-agent.cmd --prepare-only
      # The runner's TEMP is an 8.3 short path (RUNNER~1) that realpath expands; tests use the
      # runner's own long-path temp directory instead of relaxing product path checks (AGENTS.md §5).
      - run: pnpm test --project node
        env:
          TEMP: ${{ runner.temp }}
          TMP: ${{ runner.temp }}
          TMPDIR: ${{ runner.temp }}

  linux-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RDC_AGENT_SMOKE_START: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Prepare through POSIX wrapper
        shell: bash
        run: sh scripts/start-rdc-agent.sh --prepare-only
      # Ubuntu 24.04 restricts unprivileged user namespaces, which the Electron sandbox needs.
      - name: Allow the Electron sandbox
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Browser QA smoke on Linux
        run: xvfb-run -a pnpm run smoke:agent-browser

  # Renders recorded UI states from the base and head builds with the same harness and fails on differences no
  # commit declared with a `Visual-Diff-Allow:` trailer. Only runs when rendered code or the harness changed.
  visual-diff:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: github.event_name != 'push'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
          fetch-depth: 0
      - name: Resolve the comparison base
        id: base
        shell: bash
        run: |
          base="${{ inputs.base || github.event.pull_request.base.sha }}"
          if [ -z "$base" ]; then base="$(git merge-base "origin/${{ github.event.repository.default_branch }}" HEAD)"; fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$base" HEAD -- src/renderer src/shared src/preload scripts/visual-diff; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        if: steps.base.outputs.changed == 'true'
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        if: steps.base.outputs.changed == 'true'
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Build head and base
        if: steps.base.outputs.changed == 'true'
        shell: bash
        # Both builds render in head's Electron, which the prepare wrapper installs; base only contributes its out/.
        run: |
          sh scripts/start-rdc-agent.sh --prepare-only
          pnpm run build
          git worktree add "$RUNNER_TEMP/base" "${{ steps.base.outputs.sha }}"
          (cd "$RUNNER_TEMP/base" && pnpm install --frozen-lockfile && pnpm run build)
      - name: Allow the Electron sandbox
        if: steps.base.outputs.changed == 'true'
        run: sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: Capture and compare
        if: steps.base.outputs.changed == 'true'
        env:
          VISUAL_DIFF_RANGE: ${{ steps.base.outputs.sha }}..HEAD
        run: |
          node scripts/visual-diff/run.mjs capture "$RUNNER_TEMP/visual-diff/head"
          node scripts/visual-diff/run.mjs capture "$RUNNER_TEMP/visual-diff/base" --build "$RUNNER_TEMP/base"
          node scripts/visual-diff/run.mjs compare "$RUNNER_TEMP/visual-diff/base" "$RUNNER_TEMP/visual-diff/head"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: failure() && steps.base.outputs.changed == 'true'
        with:
          name: visual-diff
          path: ${{ runner.temp }}/visual-diff
          retention-days: 7

  launcher-fresh-checkout:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Prepare through Windows wrapper
        if: runner.os == 'Windows'
        shell: cmd
        run: scripts\start-rdc-agent.cmd --prepare-only
      - name: Verify conditional Windows prepare
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $output = (& scripts\start-rdc-agent.cmd --prepare-only 2>&1) -join "`n"
          $output
          if ($output -notmatch 'Dependencies are current; skipping pnpm install') { throw 'Second prepare did not skip dependency install.' }
          if ($output -notmatch 'Build outputs are current; skipping build') { throw 'Second prepare did not skip build.' }
          $expected = [IO.Path]::GetFullPath((Join-Path $HOME '.cache\rdc-agent\pnpm-store'))
          $actual = [IO.Path]::GetFullPath((pnpm store path))
          if (-not $actual.StartsWith($expected, [StringComparison]::OrdinalIgnoreCase)) { throw "Unexpected pnpm store: $actual" }
      - name: Prepare through POSIX wrapper
        if: runner.os != 'Windows'
        shell: bash
        run: sh scripts/start-rdc-agent.sh --prepare-only
      - name: Verify conditional POSIX prepare
        if: runner.os != 'Windows'
        shell: bash
        run: |
          output=$(sh scripts/start-rdc-agent.sh --prepare-only 2>&1)
          printf '%s\n' "$output"
          grep -F 'Dependencies are current; skipping pnpm install.' <<<"$output"
          grep -F 'Build outputs are current; skipping build.' <<<"$output"
          case "$(pnpm store path)" in
            "$HOME/.cache/rdc-agent/pnpm-store"/*) ;;
            *) echo "Unexpected pnpm store: $(pnpm store path)" >&2; exit 1 ;;
          esac
      - run: pnpm run check:release-config

  browser-smoke:
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        full_access: ['0', '1']
    env:
      RDC_AGENT_SMOKE_START: '1'
      RDC_AGENT_BROWSER_QA_FULL_ACCESS: ${{ matrix.full_access }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Browser QA smoke
        run: pnpm run smoke:agent-browser

  desktop-smoke:
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Prepare through Windows wrapper
        shell: cmd
        run: scripts\start-rdc-agent.cmd --prepare-only
      - run: pnpm run pack
      - name: Desktop unpacked health smoke
        run: pnpm run smoke:desktop
      - name: Release config after pack
        run: |
          pnpm run check:release-config
          pnpm run release:sbom
          pnpm run release:checksums

  # A release tag (no -rc) must be signed; without the signing secrets this job fails on purpose.
  release:
    if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, '-rc')
    needs: [build, windows-unit, desktop-smoke]
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      RDC_AGENT_RELEASE_CHANNEL: release
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Require Windows signing secrets on a release tag
        run: pnpm run check:release-config

  # A `v*-rc*` tag publishes an unsigned GitHub prerelease: installer and zip with checksums and an SBOM. Only this
  # job may write repository contents, and only after the build, Windows unit and packaged smoke jobs pass.
  prerelease:
    if: startsWith(github.ref, 'refs/tags/v') && contains(github.ref_name, '-rc')
    needs: [build, windows-unit, desktop-smoke]
    runs-on: windows-latest
    timeout-minutes: 40
    permissions:
      contents: write
    env:
      RDC_AGENT_RELEASE_CHANNEL: prerelease
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          lfs: true
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 11.7.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22.13.0'
          cache: pnpm
      - name: Prepare through Windows wrapper
        shell: cmd
        run: scripts\start-rdc-agent.cmd --prepare-only
      # Requires a prerelease package version that the tag names exactly.
      - run: pnpm run check:release-config
      - run: pnpm exec electron-builder --win --publish never
      - run: pnpm run release:sbom
      - run: pnpm run release:checksums
      - name: Publish the unsigned prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $assets = @(Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|zip)$' } | ForEach-Object { $_.FullName })
          $assets += 'release/SHA256SUMS.txt', 'release/sbom.cdx.json', 'release/sbom.cdx.json.sha256'
          $notes = "Unsigned prerelease. Windows SmartScreen warns before the first start; verify the download against SHA256SUMS.txt. The SBOM lists every bundled dependency."
          gh release create "${{ github.ref_name }}" @assets --prerelease --title "RDC-Agent ${{ github.ref_name }}" --notes $notes
